# lexicon.yaml -- the engine's recognition VOCABULARIES. Edit it here, or in the
# app under Admin -> Data capture -> "Words the tool knows to look for" (one word
# at a time in plain English, or this whole file under "Edit the whole vocabulary
# file"). Every category you DON'T list falls back to the built-in default, so an
# empty file behaves exactly like the shipped engine.
#
# How each category merges with the built-in (see R/lexicon.R):
#   * word lists   -> your entries are ADDED to the built-in (adding "cow" keeps
#                     "D"/"DR"/...); you cannot delete a built-in this way.
#   * regexes      -> your value REPLACES the built-in (rejected if it won't compile).
#   * date_formats -> your entries are APPENDED (tried after the built-ins).
#   * field_name_patterns -> your entry OVERRIDES the built-in for that field.
#
# Example: a bank that marks its debit/credit column "Paid" / "Recd" (not one of
# the built-in D / DR / Debit / ... markers). Uncomment to teach the whole engine
# (detection + drafting + parsing) to recognise them -- no code change:
#
#   debit_markers:  [Paid]
#   credit_markers: [Recd]
#
# The editable categories are NOT listed here on purpose: a hand-copied list goes
# stale (this one was missing three of them), and a wrong list of "what you can
# edit" is worse than none. The live list is generated from .lexicon_spec()
# (R/lexicon.R) in two places you can read instead:
#   * the Admin "Show built-in defaults" button -- every category with a complete,
#     valid starting value;
#   * validate_lexicon(), which refuses to save a category that isn't one.
