      - {name: "ANZ National Bank Limited", from: "2004-06-28", to: "2012-10-29"}
      - {name: "ANZ Banking Group (New Zealand) Limited", from: "1987", to: "2004-06-28"}
      - {name: "The National Bank of New Zealand Limited", to: "2004-06-26", note: "brand used to about 2012; code 06"}
      - {name: "Post Office Bank Limited", to: "1994-12-01", note: "PostBank; code 11"}
      - {name: "Countrywide Banking Corporation Limited", to: "1998-11-27", note: "code 25"}
      - {name: "ANZ New Zealand Investments Limited", note: "KiwiSaver and fund statements"}
      - {name: "Australia and New Zealand Banking Group Limited", global: true}
    domains: ["anz.co.nz", "anzinvestments.co.nz"]
    phones: ["0800 269 296"]
    swift: ["ANZBNZ22"]
    brand_words: ["ANZ", "The National Bank", "PostBank"]

