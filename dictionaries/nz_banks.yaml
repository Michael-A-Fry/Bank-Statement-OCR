# nz_banks.yaml -- who issues NZ bank statements, and how a statement says so.
#
# Read by R/bank_identity.R. Each institution lists what the statement itself can
# show about its issuer: legal names (current and former, with the years they were
# used), web domains, phone numbers, SWIFT/BIC codes and masthead brand words.
# `family` is the clearing bank whose bank code the institution's accounts carry
# (agency banking): an account number in the 02 code is consistent with BNZ and
# with every bank in BNZ's family, and the statement's own wording decides which.
#
# Strength of each kind of evidence is set in R/bank_identity.R, not here.
#   global: true   -- the legal name is also used outside New Zealand (an
#                     Australian or UK statement can carry it), so it counts less.
#   pseudo: true   -- not a statement issuer: an account number in one of these
#                     register branches tells only the family.
#   not_after      -- words that, printed just before the name, make it a different
#                     name ("Reserve Bank of New Zealand" is not BNZ).
#
# Sources (all read 3 Oct 2026; see the research note bank_identity.md):
#   Legal names and dates  RBNZ registers of banks (current, and no longer registered),
#                          Wayback copies of 30 Sep and 2 Oct 2026.
#   Domains, phones        each bank's own website, Oct 2026.
#   SWIFT/BIC              each bank's "receive money from overseas" page; codes
#                          marked "directory" are from third-party directories only.
#   Branch numbers         dictionaries/nz_bank_branches.csv: every row of the Payments
#                          NZ Bank Branch Register of 25 Sep 2026 (last_seen 2026-09-25),
#                          plus 11 branches since removed, taken from earlier register
#                          snapshots (Mar 2024, Jan 2026) so older statements still match;
#                          their last_seen is the last snapshot that listed them. The
#                          institution column is the code owner, except the agency
#                          branches the register names (Co-operative Bank, Wise, ...)
#                          and 02-1243 / 02-1255 ("PC Business/Internet Banking", at the
#                          Co-operative Bank's address), which are bnz_agency: they may be
#                          the Co-operative Bank's, so they say only "BNZ's family".
# Adding a bank: copy an entry, give it a new id, and add its branch rows to the CSV.

meta:
  updated: "2026-10-03"
  register_date: "2026-09-25"

institutions:
  anz:
    display: ANZ
    family: anz
    codes: ["01", "04", "06", "11", "25"]
