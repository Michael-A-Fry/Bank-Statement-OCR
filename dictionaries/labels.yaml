# labels.yaml -- WHAT A FACT ABOUT THE STATEMENT IS CALLED
#
# Each section below is one fact the tool reads off a statement: the opening
# balance, the closing balance, the statement period and its dates. Under it are
# the wordings banks print in front of that fact.
#
# EXAMPLE. A statement prints
#       Kickoff kitty            $1,250.00
# and "Kickoff kitty" is its opening balance. Add one line under opening_balance:
#       - "kickoff kitty"
#
# The easy way is Admin -> Words: type the wording, pick what it means, press
# Teach it. Or, on Please check, pick the wording from the statement itself. Both
# put it in the right file and refuse a wording that would clash with another.
#
# Rules:
#   * Case doesn't matter, and part of a line is enough: "balance at start"
#     matches "Balance at start of period".
#   * One wording, one meaning. "balance" alone would also match "Closing
#     balance", so it is refused.
#   * Words INSIDE the transaction table (DR / CR marks, column headings, a
#     "Page total" line) are not kept here: they are in lexicon.yaml.
#
# value: money | date | date_range -- what kind of figure follows the wording.

# On a statement:  Opening balance          $1,250.00
opening_balance:
  any_of:
    - "opening balance"
    - "balance brought forward"
    - "balance b/f"
    - "brought forward"
    - "opening ledger balance"
    - "beginning balance"
    - "starting balance"
    - "balance forward"
    - "previous balance"        # credit-card wording
    - "balance from previous statement"
  value: money

# On a statement:  Closing balance            $980.40
closing_balance:
  any_of:
    - "closing balance"
    - "balance carried forward"
    - "balance c/f"
    - "carried forward"
    - "closing ledger balance"
    - "ending balance"
    - "new balance"             # credit-card wording
    - "balance at end"
    - "final balance"
  value: money

# On a statement:  Statement date: 3 April 2026
statement_date:
  any_of: ["statement date", "date of issue", "issue date", "date issued", "issued"]
  value: date
  where: page1

# On a statement:  Statement period   1 Mar 2026 to 31 Mar 2026
# The wording must be the whole cell in front of the two dates, so "Fixed rate for
# the period ..." is not one. A range labelled this way is the period and wins
# over any other range on the page (an RWT certificate's tax year, a fixed-rate
# term). Read by R/extract_metadata.R (.period_labels).
statement_period:
  any_of: ["statement period", "period", "statement dates", "statement for the period",
           "statement from", "period covered", "statement covers"]
  value: date_range

# On a statement:  Opening date: 10 June 2026      Closing date: 9 July 2026
# The period printed as two LABELLED dates instead of "from X to Y" (Westpac and
# ASB do this). Used for the period, and for the year of day-and-month dates,
# when no range is printed.
statement_start:
  any_of: ["statement opening date", "opening date", "period start", "start date",
           "statement period start", "from date", "opening"]
  value: date
statement_end:
  any_of: ["statement closing date", "closing date", "period end", "end date",
           "statement period end", "to date", "closing"]
  value: date
