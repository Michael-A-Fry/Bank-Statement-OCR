# Statement Studio configuration.
#
# Copy this file to  config/config.yaml  and edit it. config/config.yaml is
# kept out of any distributed copy, so your real settings (including the admin
# password) stay on the server. Any key you leave out falls back to a sensible built-in default,
# so a partial file is fine.

app:
  title: Statement Studio
  # The Admin-tab barrier - a simple gate to share with a few maintainers.
  # (Can also be set via the BSO_ADMIN_PASSWORD environment variable, which wins.)
  # CHANGE THIS. While it is still the placeholder "changeme" (or blank) the app
  # REFUSES to open the Admin tab for anybody - Admin manages learned layouts, the shared
  # label dictionary and the analytics feed, so a password printed in the docs is
  # no password at all. Set it here, or set BSO_ADMIN_PASSWORD, then restart.
  admin_password: changeme
  # The URL Qlik's "Convert a statement" tile opens. Point it at your Shiny deployment.
  shiny_url: http://localhost:8100
  port: 8100
  # Biggest statement a user may upload, in MB. Shiny's own default is only 5 MB,
  # which rejects scanned statements; 200 comfortably fits a year-long 300-dpi scan.
  max_upload_mb: 200
  # How many statements the server may convert AT THE SAME TIME. Each conversion
  # runs in its own short-lived R process, so one analyst's scanned statement no
  # longer freezes everybody else's page - but the machine has only so many cores.
  # THE TRADE-OFF: higher lets more analysts convert at once, and past the core
  # count they all get slower together (OCR is CPU-bound) and memory climbs, on
  # the same box that has to keep serving every browser. Lower keeps each
  # conversion fast and makes people queue - which the screen tells them, by
  # name and by position, so a wait is never silent.
  # Leave it out and it works itself out from the hardware: one less than the
  # core count, never fewer than 2, never more than 6. Set it only if you have
  # measured this server. 1 means strictly one at a time (still queued, still
  # announced - the old behaviour, minus the frozen pages).
  # max_concurrent_jobs: 3

paths:
  dictionary: dictionaries/labels.yaml  # label wordings (Admin -> Words)
  lexicon: dictionaries/lexicon.yaml     # recognition vocabulary (Admin -> Words)
  uploads: uploads
  requests: requests
  logs: logs
  # Bank layouts the automatic reader has learned (Admin -> Banks), a folder per
  # bank. Learned here from your own statements, so BACK IT UP with the logs:
  # it exists nowhere else. Every change is a new file; nothing is edited in place.
  layouts: templates/layouts
  # Automatic-reading tracking (Admin -> Automatic reading): one line per event,
  # a file per month. Codes and counts only -- never names, descriptions,
  # amounts, dates, account numbers or file names.
  tracking: logs/tracking

retention:
  # A copy of every converted statement is kept under uploads/<id>/ so a format
  # that failed can be picked up and fixed. These are REAL client statements.
  # After this many days the tidy-up deletes the copied file and keeps only the
  # small record of what happened to it. Set 0 to keep the copies indefinitely.
  # The number is stated on Admin -> Health -> "Saved statements - retention"
  # (and on the delete button beside it), so an analyst converting a statement is
  # not shown it. Confirm it against your unit's own retention policy before
  # go-live: docs/operational/go-live-checklist.md step 5. The tidy-up runs at
  # every startup as well as on that button, so shortening this deletes anything
  # already older than the new number the next time the app starts.
  uploads_keep_days: 90

# A `metadata:` block also exists (local-only capture detail). Its defaults are
# right for nearly every server, so it is omitted here; Admin -> Health -> "Data
# capture" says what it records, and docs/context/metadata-capture.md lists its keys.

auto_reading:
  # Spot checks: the share of AUTOMATIC conversions (proven by the statement's own
  # arithmetic) marked for a person to eyeball, from 0 to 1. 0 = off, the default.
  # 0.05 marks about one in twenty. Which statements are picked depends on the
  # file itself, so the same statement is always picked, or never. A statement
  # with no balance and no totals, converted on a proven layout, is picked at
  # twice this rate.
  spot_check_rate: 0
  # A statement whose design the tool has not been taught (no accepted recipe) is
  # never converted without a person, even when it adds up: "ask" (the default)
  # puts it on Please check, filled in, and the person's "It's right" teaches the
  # design. "auto" converts such a statement on its arithmetic alone, as 2.x did.
  unknown_design: ask

feed:
  # The analytics feed Qlik loads for dashboards. Accountants convert in the Shiny
  # app; each result is written here (gated) and a Qlik folder connection + reload
  # turns it into dashboards. Only a statement the arithmetic proved (or that
  # matched a proven layout), or that a person confirmed as right, reaches the
  # dashboard table; everything else is withheld, with the reason.
  enabled: true                         # write the feed on each conversion
  feed_dir: feed
  include_review_feed: true             # also write withheld runs to feed/review (separate table)
